name: MyCrewMate – Container veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Der Workflow baut auf einem GitHub-Runner und veröffentlicht das fertige
# Image in der GitHub Container Registry. Coolify muss das Image danach nur
# noch herunterladen und starten – kein speicherintensiver lokaler Build.
permissions:
  contents: read
  packages: write

concurrency:
  group: mycrewmate-container-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mycrewmate

jobs:
  publish:
    name: Docker-Image bauen und veröffentlichen
    runs-on: ubuntu-24.04
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Image extern bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
