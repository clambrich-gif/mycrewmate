name: MyCrewMate – Container veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Der Workflow baut auf einem GitHub-Runner und veröffentlicht das fertige
# Image in der GitHub Container Registry. Coolify muss das Image danach nur
# noch herunterladen und starten – kein speicherintensiver lokaler Build.
permissions:
  contents: read
  packages: write

concurrency:
  group: mycrewmate-container-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mycrewmate

jobs:
  publish:
    name: Docker-Image bauen und veröffentlichen
    runs-on: ubuntu-24.04
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Image extern bauen und veröffentlichen
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$IMAGE_TAGS" | sed '/^$/d')
          test "${#tags[@]}" -gt 0

          # Der Docker-Daemon des GitHub-Runners enthält bereits ein eigenes
          # BuildKit. So muss kein separates BuildKit-Containerimage aus einer
          # öffentlichen Registry gestartet werden, das durch Abruflimits
          # scheitern könnte.
          docker build --pull=false --file ./Dockerfile --tag "${tags[0]}" .

          for tag in "${tags[@]}"; do
            if [ "$tag" != "${tags[0]}" ]; then
              docker tag "${tags[0]}" "$tag"
            fi
            docker push "$tag"
          done

      - name: Neue Version sicher in Coolify bereitstellen
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK_URL"
          test -n "$COOLIFY_DEPLOY_TOKEN"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK_URL"
